# Local/dev stack only.
# For any internet-reachable host, terminate TLS in front (Caddy/Traefik),
# set HSTS, and remove the loopback port bindings below.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: finpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    # No published port: the backend reaches Postgres over the Compose network.
    # Exposing 5432 publicly would allow unauthenticated access attempts from
    # the internet (CWE-668).
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./finpilot-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/finpilot
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

  frontend:
    build:
      context: ./finpilot-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:80"

volumes:
  postgres_data:
