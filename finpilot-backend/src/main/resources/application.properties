spring.application.name=finpilot-backend
server.port=8080

# --- PostgreSQL connection ---
# Create this database locally first: createdb finpilot   (or via pgAdmin/psql)
spring.datasource.url=jdbc:postgresql://localhost:5432/your_db_name
spring.datasource.username=username
spring.datasource.password=password

# Flyway owns the schema. Hibernate only validates entities against it -
# never "update" or "create" here, or you lose migration history as a source of truth.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT ---
# Required: provide a unique random 256-bit+ value via the environment. This
# intentionally has no committed fallback; a backend that signs JWTs with a
# public source-controlled secret is not safe even for a shared test instance.
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

# Comma-separated browser origins permitted to call the API directly. Vite's
# proxy does not need this in local development; configure it for production.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# --- AI Setup (OpenAI) ---
# Optional feature - if OPENAI_API_KEY isn't set, /api/v1/intelligence/narrative
# returns a clear 503 rather than crashing the app. Get a key at
# platform.openai.com/api-keys. NEVER hardcode a real key here - this reads
# from an environment variable so nothing sensitive ever gets committed to git.
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.model=gpt-4o-mini
# text-embedding-3-small: cheap (~$0.02 per 1M tokens) and fast - the right
# tier for retrieval over a personal transaction history, not a case that
# needs the larger/more expensive embedding model.
app.ai.openai.embedding-model=text-embedding-3-small
# Deliberately small - this is a 2-3 sentence narration, not a long response.
# Keeping max tokens low keeps cost per request predictable and low.
app.ai.openai.max-tokens=200

# --- File upload (statement import) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
