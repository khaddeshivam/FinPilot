server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS; short TTL so a recreated backend container is found.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Match the backend's 5MB CSV upload limit (nginx default is 1MB -> 413).
    client_max_body_size 6m;

    # Forward API calls to the backend container.
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # All other paths go to index.html for React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
